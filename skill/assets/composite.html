<body>
<main class="shell">
<div class="masthead"><div class="brand">KCPREDICT <small>PRICE · STRUCTURE · SCENARIOS</small></div><div class="local">本地研究档案 · 单文件离线可用</div></div>
<section class="hero"><div><div class="eyebrow">MARKET STRUCTURE / CONTINUOUS TIMELINE</div><div class="titleline"><h1 id="symbol"></h1><span class="subtitle">三个月综合研究</span></div><div class="meta" id="meta"></div><div class="quote"><strong id="close"></strong><span class="delta" id="windowChange"></span><span class="meta" id="relationship"></span></div></div><div class="quality" id="quality"><div class="badge" id="qualityBadge"></div><p id="qualityDescription"></p><div class="bar" id="qualityBar"><b id="qualityFill"></b><i id="qualityThreshold"></i></div><p id="qualityNumbers"></p></div></section>
<section class="workspace" id="workspace">
<div class="chart-head"><div class="chart-title">价格、结构与未来路径 <small id="rangeLabel"></small></div><div class="presets"><button data-window="all" class="active">完整窗口</button><button data-window="40">40根</button><button data-window="20">20根＋预测</button><button id="full">全屏</button></div></div>
<div class="layers"><label><input type="checkbox" data-layer="structure" checked><i class="dot"></i>笔与中枢</label><label><input type="checkbox" data-layer="ict" checked><i class="dot ict"></i>ICT</label><label><input type="checkbox" data-layer="prediction" checked><i class="dot median"></i>预测中位数</label><label><input type="checkbox" data-layer="band" checked><i class="dot band"></i>P10–P90</label><label><input type="checkbox" data-layer="samples"><i class="dot path"></i>有效样本路径</label><label><input type="checkbox" data-layer="volume" checked>成交量</label></div>
<div class="inspector" id="inspector" aria-live="polite"></div>
<div class="chartbox" id="chartbox"><svg id="chart" role="img" tabindex="0" aria-label="真实日线连接未来情景的连续时间轴；左右方向键平移，加减键缩放，Home恢复"></svg><div id="tooltip" class="tooltip" hidden></div></div>
<div class="timeline"><span id="visibleRange"></span><input type="range" id="pan" aria-label="平移时间窗口" min="0" value="0" step="1"><span class="hint">滚轮缩放 · 拖动平移 · 点击锁定日期</span></div>
<div class="chart-foot"><div class="legend"><span><i></i>收涨</span><span><i class="down"></i>收跌</span><span><i class="future"></i>未来情景区</span><span>金色：结构 · 紫色：ICT · 蓝色：预测</span></div><span id="scenarioNote"></span></div>
</section>
<section class="evidence"><div class="tabbar" role="tablist" aria-label="研究详情"><button class="active" role="tab" aria-selected="true" data-tab="evidencePanel">证据与共振</button><button role="tab" aria-selected="false" data-tab="forecastPanel">未来逐日明细</button><button role="tab" aria-selected="false" data-tab="auditPanel">数据与质量</button><button id="download" class="download">导出数据 ↓</button></div>
<div class="tabcontent" id="evidencePanel" role="tabpanel"><div class="summary-grid" id="evidenceGrid"></div><div class="takeaway" id="takeaway"></div><details><summary>展开结构、ICT 的确认时间与生命周期</summary><div id="eventTable" class="scroll-table"></div></details></div>
<div class="tabcontent" id="forecastPanel" role="tabpanel" hidden><div id="forecastTable" class="scroll-table"></div><p class="note">P10–P90 是有效采样的收盘价分位区间；中位路径和区间均属于模型情景。上涨样本比例不等于校准概率或历史胜率。</p></div>
<div class="tabcontent" id="auditPanel" role="tabpanel" hidden><div class="audit-stats" id="auditStats"></div><div class="audit-grid" id="auditDetails"></div></div>
</section>
<footer class="fineprint" id="fineprint"></footer>
</main>
<script id="chart-data" type="application/json">__DATA_JSON__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('chart-data').textContent), B=D.bars, P=D.prediction, F=P.forecast||[], Q=P.quality||{}, N=B.length, H=F.length, T=N+H;
const $=id=>document.getElementById(id), e=value=>String(value??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), finite=x=>typeof x==='number'&&Number.isFinite(x), fmt=(x,k=2)=>finite(x)?x.toFixed(k):'—', pct=(x,k=2)=>finite(x)?(x*100).toFixed(k)+'%':'—', short=x=>String(x||'').slice(0,10), amount=x=>finite(x)?x>=1e8?fmt(x/1e8)+'亿股':x>=1e4?fmt(x/1e4)+'万股':fmt(x,0)+'股':'—';
const colors={up:'#c86c58',down:'#3c8b80',blue:'#4275cd',gold:'#b28f43',purple:'#8c77ac',muted:'#7e9098'}, last=B[N-1], dates=B.map(b=>short(b.time)).concat(F.map(f=>short(f.date))), dateIndex=new Map(dates.map((d,i)=>[d,i]));
const statusNames={pass:'预测质量通过',fail:'预测质量未通过',unavailable:'预测不可用',not_executed:'预测未执行'}, state={start:0,end:T-1,layers:{structure:true,ict:true,prediction:true,band:true,samples:false,volume:true},hover:null,pinned:false,drag:null};
const S=D.structure||{}, V=D.price_volume||{}, I=D.ict||{}, sc=S.current_state||{}, vc=V.current_state||{}, w=V.w32_latest||{}, notes=I.notes||[], fvg=I.latest_fvg||I.latest_bearish_fvg||I.latest_bullish_fvg;
const validDirection=x=>['available','partial'].includes(x.status)&&['BUY','SELL'].includes(x.direction_state)?x.direction_state:null, sdir=validDirection(S),vdir=validDirection(V);
const relationship=sdir&&vdir?sdir===vdir?'结构与量价同向，ICT仍需独立验证':'结构与量价方向存在分歧':'方向证据待核验';
const lastNote=[...notes].reverse().find(x=>['ssl_candidate','bsl_candidate'].includes(x.type));
function init(){
document.title=D.meta.symbol+' · 连续结构研究 · '+short(D.meta.data_end);$('symbol').textContent=D.meta.symbol;document.querySelector('.subtitle').textContent='近'+D.meta.months+'个月综合研究';$('meta').textContent=short(B[0].time)+' — '+short(last.time)+' · '+N+'根闭合日线 · '+(D.meta.price_basis==='unadjusted'?'未复权价格 / 元':'价格口径待核验')+' · '+(D.meta.timezone||'时区未报告');$('close').textContent=fmt(last.close);const delta=last.close/B[0].close-1;$('windowChange').textContent='窗口变化 '+(delta>0?'+':'')+pct(delta);$('windowChange').style.color=delta>=0?colors.up:colors.down;$('relationship').textContent=relationship;
$('quality').classList.add(P.status);$('qualityBadge').textContent=statusNames[P.status];$('qualityDescription').textContent=P.status==='pass'?'通过样本与输入可用性检查，仍需独立判断。':P.status==='fail'?'仅供观察采样情景，不能视为可用预测。':(P.reason||'保留已有历史证据与缺失原因。');
if(finite(Q.valid_fraction)){$('qualityFill').style.width=Math.min(1,Math.max(0,Q.valid_fraction))*100+'%';$('qualityThreshold').style.left=(Q.minimum_valid_fraction||0)*100+'%';$('qualityNumbers').textContent='有效 '+Q.valid_samples+'/'+Q.requested_samples+' · '+pct(Q.valid_fraction,3)+' / 门槛 '+pct(Q.minimum_valid_fraction,0)+' · 最少'+Q.minimum_valid_samples+'条';}else{$('qualityBar').hidden=true;$('qualityNumbers').textContent='未提供可评估的有效样本统计';}
$('scenarioNote').textContent=H?'最后真实收盘直接连接'+H+'日情景；蓝带为采样分位区间':'未产生未来路径；没有推算或补造交易日期';
$('fineprint').textContent='时钟：笔与中枢为当前截止日回溯几何，锚点与确认时间分开；形成中笔不作历史确认。ICT机械状态不等于最终交易确认。来源：'+(D.provenance.provenance||'未报告')+'，独立外部认证 '+(D.provenance.externally_verified===true?'是':'未完成')+'。图层与缩放仅改变显示，不会重算模型、改写历史或提高质量资格。';
buildDetails(); inspect(N-1); draw();
}
function table(headers,rows){return '<table class="data-table"><thead><tr>'+headers.map(h=>'<th>'+e(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+e(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}
function buildDetails(){
const rawLabels=Array.isArray(sc.native_labels)?sc.native_labels:Object.values(sc.native_labels||{}), labels=[...new Set(rawLabels.map(x=>typeof x==='string'?x:x.label||''))].filter(x=>x&&x!=='其他').join(' / ')||'未提供确认标签';
const zone=[...(D.zones||[])].reverse().find(z=>z.display_confirmed), latestEvent=w.wyckoff_event&&w.wyckoff_event!=='none'?w.wyckoff_event:'无新事件';
const structureBody='当前支撑 '+fmt(sc.support_floor)+' / 上沿 '+fmt(sc.resistance_ceiling)+'<br>中枢确认 '+e(short(sc.structure_confirmed_at)||(zone?short(zone.confirmation_time):'未报告'))+'<br>标签 '+e(labels)+'；同源标签不重复计票。';
const pvBody='相对此前20日量 '+fmt(V.relative_volume20)+'倍 · 收盘位置 '+pct(w.w_close_location,1)+'<br>需求 / 供给 '+fmt(vc.buy_score,3)+' / '+fmt(vc.sell_score,3)+'<br>最新事件 '+e(latestEvent)+'；旧状态延续不等于新确认。';
const ictBody=(lastNote?short(lastNote.date)+' '+(lastNote.type==='ssl_candidate'?'SSL':'BSL')+'人工候选 '+fmt(lastNote.extreme)+'<br>旧点 '+fmt(lastNote.reference_price)+' / 收盘 '+fmt(lastNote.close)+'<br>':'')+(fvg?'严格'+(fvg.direction==='bearish'?'空头':'多头')+'FVG '+fmt(fvg.zone[0])+'–'+fmt(fvg.zone[1])+'<br>':'')+(lastNote&&finite(lastNote.mss_reference_price)?'原设定MSS参考 '+fmt(lastNote.mss_reference_price)+'<br>':'')+'位移、收盘MSS、有效回撤与净盈亏比需串联验证。';
const available=x=>({available:'输入可用',partial:'部分可用',unavailable:'暂不可用',completed:'已扫描'}[x]||'待核验'), bias=x=>({BUY:'偏多',SELL:'偏空'}[x]||'方向待核验'), finalNames={not_assessed:'最终确认尚待核验',confirmed:'最终设定已确认',developing:'设定形成中',invalidated:'原设定已失效','no-trade':'暂无可执行设定'};
const cells=[['CZSC 结构',available(S.status),bias(sdir),structureBody],['威科夫 / 量价',available(V.status),bias(vdir),pvBody],['ICT / SMC',available(I.status),finalNames[I.final_status]||'最终确认尚待核验',ictBody]];
$('evidenceGrid').innerHTML=cells.map(c=>'<div class="evidence-unit"><h2>'+e(c[0])+' <small>'+e(c[1])+'</small></h2><strong>'+e(c[2])+'</strong><p>'+c[3]+'</p></div>').join('');
$('takeaway').innerHTML='<b>'+e(relationship)+'</b> · '+e(P.status==='fail'?'预测质量未通过，路径只作情景参考。':P.status==='pass'?'预测通过可用性门槛，不能代替结构、量价和ICT的共振验证。':P.reason||statusNames[P.status]);
$('forecastTable').innerHTML=H?table(['交易日期','P10 收盘','中位收盘','P90 收盘','中位变化 / 末收盘','中位量（模型）'],F.map(r=>[short(r.date),fmt(r.close_p10),fmt(r.close),fmt(r.close_p90),pct(r.close/last.close-1),amount(r.volume)])):'<p class="note">'+e(statusNames[P.status]+'：'+(P.reason||'没有已评估的未来路径'))+'</p>';
let events=[];for(const z of D.zones||[])if(z.display_confirmed)events.push(['CZSC 中枢',short(z.start_time)+' → '+short(z.end_time),fmt(z.low)+'–'+fmt(z.high),short(z.confirmation_time),'回溯几何']);
