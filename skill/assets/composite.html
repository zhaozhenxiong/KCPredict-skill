<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>KCPredict · 连续结构研究</title>
<style>
__THEME_CSS__
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper);font:var(--body-px)/var(--body-line-height) var(--font-stack);font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:var(--card);border:1px solid var(--line);padding:7px 13px;border-radius:6px;line-height:1.5;white-space:nowrap}
button:hover{border-color:var(--accent);background:var(--button-hover)}
button.active{background:var(--button-active);color:var(--button-active-ink);border-color:var(--button-active-line)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible,svg:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,p{margin:0}strong{font-weight:600}
.shell{max-width:var(--max-width-px);padding:0 28px 32px;margin:auto;min-width:0}
.masthead{display:flex;justify-content:space-between;align-items:center;gap:20px;background:var(--card);border-bottom:1px solid var(--line);padding:17px 20px;margin:0 -28px}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:650}
.brand svg{width:31px;height:31px;fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.brand small{font-size:11px;color:var(--muted);font-weight:400;display:block;line-height:1.3;letter-spacing:1px}
.local{font-size:12px;color:var(--muted)}
.data-strip{display:flex;gap:22px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:10px 0;color:var(--muted);font-size:12px}
.data-strip strong{color:var(--ink)}.status-dot{display:inline-flex;align-items:center;gap:7px}.status-dot:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--down)}
.hero{padding:22px 0 18px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.titleline{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}h1{font-size:var(--title-px);line-height:1.5;letter-spacing:-.5px;font-weight:650}.subtitle{font-size:14px;color:var(--muted)}
.meta{color:var(--muted);font-size:12px;margin-top:4px}.quote{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:8px}.quote strong{font-size:var(--quote-px);font-weight:500;line-height:1.25}.quote .delta{font-size:12px}
.quality{max-width:370px;min-width:275px;border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:6px;background:var(--card);padding:12px 16px}
.badge{color:var(--amber);font-size:13px;font-weight:600}.quality.pass{border-left-color:var(--down)}.quality.pass .badge{color:var(--down)}.quality.unavailable,.quality.not_executed{border-left-color:var(--muted)}.quality.unavailable .badge,.quality.not_executed .badge{color:var(--muted)}
.quality p{font-size:11px;color:var(--muted);margin-top:4px}.quality .bar{width:100%;height:4px;background:var(--quality-track);margin:10px 0 6px;position:relative;border-radius:3px}.quality .bar b{display:block;height:100%;background:var(--amber);border-radius:3px}.quality.pass .bar b{background:var(--down)}.quality .bar i{position:absolute;top:-3px;bottom:-3px;border-left:1px dashed var(--quality-threshold)}
.analysis-workspace{display:grid;grid-template-columns:minmax(0,1fr) var(--sidebar-width-px);gap:var(--workspace-gap-px);align-items:stretch}
.workspace,.event-panel,.evidence{background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:0 3px 16px var(--workspace-shadow);min-width:0;overflow:hidden}
.chart-head{padding:12px 17px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.chart-title{font-size:14px;font-weight:600}.chart-title small{font-size:11px;font-weight:400;color:var(--muted);margin-left:12px}
.presets{display:flex;gap:2px;padding:2px;background:var(--foot-background);border:1px solid var(--line);border-radius:6px}.presets button{font-size:12px;padding:5px 10px;border:0;background:transparent}.presets button.active{background:var(--card);color:var(--accent);box-shadow:0 1px 4px var(--workspace-shadow)}
.layers{display:flex;align-items:center;gap:14px;padding:12px 17px 8px;flex-wrap:wrap}.layers label{cursor:pointer;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}.layers input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.dot{width:17px;height:0;display:inline-block;border-top:2px solid var(--accent)}.dot.ict{border-color:var(--purple)}.dot.median{border-color:var(--blue);border-top-style:dashed}.dot.band{height:8px;border:0;background:var(--band-swatch)}.dot.path{border-color:var(--sample-swatch)}
.structure-legend{display:flex;gap:10px 18px;flex-wrap:wrap;margin:0 17px;padding:7px 0 10px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}.structure-legend span{display:inline-flex;align-items:center;gap:6px}.structure-legend i{display:inline-block;width:17px;border-top:2px solid var(--accent)}.structure-legend i.pending{border-top-style:dashed}.structure-legend i.zone{height:10px;border:1px solid var(--up);background:var(--zone-fill)}.structure-legend i.fvg{height:10px;border:1px solid var(--fvg);background:var(--fvg);opacity:.3}
.inspector{min-height:43px;padding:10px 17px 7px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:11px;line-height:1.6;color:var(--muted)}.inspector strong{color:var(--ink);font-weight:500}.inspector .kind{color:var(--accent);font-weight:600}.inspector .model{color:var(--blue)}
.chartbox{position:relative;padding:0 8px}.chartbox svg{width:100%;height:var(--chart-height-px);display:block;touch-action:pan-y;user-select:none}.chartbox svg text{font:var(--chart-px) var(--font-stack);fill:var(--muted)}.chartbox svg .chart-label{font-size:11px;fill:var(--chart-label)}.chartbox svg .price-label{font-size:11px;fill:var(--blue);font-weight:500}
.tooltip{position:absolute;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-size:12px;max-width:min(290px,92%);z-index:10;box-shadow:0 5px 20px var(--tooltip-shadow)}.tooltip small{color:var(--muted)}
.timeline{display:flex;align-items:center;gap:14px;padding:8px 17px 12px;font-size:11px;color:var(--muted)}.timeline input{width:100%;height:4px;accent-color:var(--accent);cursor:pointer}.timeline span{white-space:nowrap}
.chart-selection{display:flex;align-items:center;gap:10px;padding:4px 17px 10px;font-size:11px;color:var(--muted)}.chart-selection button{font-size:11px;padding:4px 8px}
.chart-foot{padding:10px 17px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;background:var(--foot-background);flex-wrap:wrap}.legend{display:flex;gap:14px;flex-wrap:wrap}.legend span{white-space:nowrap}.legend i{display:inline-block;width:7px;height:7px;background:var(--up);margin-right:5px}.legend i.down{background:var(--down)}.legend i.future{background:var(--future-swatch)}
.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px;border-bottom:1px solid var(--line)}.panel-heading h2{font-size:15px;font-weight:600}.panel-heading span{font-size:11px;color:var(--muted)}
.summary-grid{display:grid;padding:0 17px}.evidence-unit{padding:15px 0;border-bottom:1px solid var(--line);min-width:0}.evidence-unit:last-child{border:0}.evidence-unit h2{font-size:13px;font-weight:600;margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.evidence-unit h2 small{font-size:11px;color:var(--muted);font-weight:400}.evidence-unit strong{font-size:15px;font-weight:600}.evidence-unit p{font-size:12px;line-height:1.75;color:var(--muted);margin:7px 0 0;overflow-wrap:anywhere}
.takeaway{margin:0 17px;padding:12px 0 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);overflow-wrap:anywhere}.takeaway b{font-weight:500;color:var(--accent)}
.evidence{margin-top:20px}.tabbar{display:flex;gap:24px;border-bottom:1px solid var(--line);padding:0 17px;align-items:center;flex-wrap:wrap}.tabbar button{border:0;border-radius:0;background:none;font-size:13px;padding:12px 0;color:var(--muted);position:relative}.tabbar button.active{color:var(--accent)}.tabbar button.active:after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--accent)}.tabbar .download{margin-left:auto;font-size:11px}.tabcontent{padding:16px 17px}
.data-table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}.data-table th{color:var(--muted);font-weight:500;font-size:11px;background:var(--foot-background)}.data-table td,.data-table th{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line)}.data-table td:first-child,.data-table th:first-child{text-align:left}.data-table tr:hover td{background:var(--table-hover)}.scroll-table{overflow:auto;max-height:460px}.note{font-size:12px;color:var(--muted);margin:10px 0}
.audit-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.audit-grid details{border-bottom:1px solid var(--line);padding:12px 0;min-width:0}summary{cursor:pointer;font-size:12px;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:400px;overflow:auto;font:var(--code-px)/1.7 var(--mono-font-stack);color:var(--code-ink)}.audit-stats{font-size:12px;line-height:2;overflow-wrap:anywhere}.fineprint{font-size:11px;color:var(--muted);margin-top:20px;border-top:1px solid var(--line);padding-top:14px;line-height:1.9}
#workspace:fullscreen{overflow:auto;border-radius:0;background:var(--card);padding:20px;display:flex;flex-direction:column}#workspace:fullscreen .chartbox{flex:1;min-height:420px}#workspace:fullscreen svg{height:100%}
[hidden]{display:none!important}
@media(min-width:1650px){.analysis-workspace{grid-template-columns:minmax(0,1fr) 300px}}
@media(max-width:1100px){.analysis-workspace{grid-template-columns:minmax(0,1fr)}.summary-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.evidence-unit{border-bottom:0}.event-panel .takeaway{margin-top:0}.chartbox svg{height:clamp(370px,50vh,var(--chart-height-px))}}
@media(max-width:__MOBILE_BREAKPOINT_PX__px){.shell{padding:0 14px 24px}.masthead{margin:0 -14px;padding:14px}.local{display:none}.data-strip{gap:6px 16px;font-size:11px}.hero{align-items:start;flex-direction:column;padding:18px 0;gap:14px}.quality{width:100%;max-width:none;min-width:0}.titleline{gap:10px}.quote{gap:10px}.chart-head{padding:12px;gap:10px}.chart-title small{display:none}.layers{padding:10px 12px 8px;gap:10px}.layers label{font-size:11px}.structure-legend{margin:0 12px;gap:6px 12px}.inspector{padding:8px 12px;gap:7px 10px;font-size:10px;min-height:61px}.chartbox{padding:0 3px}.chartbox svg{height:var(--mobile-chart-height-px)}.timeline{padding:8px 12px 12px;gap:9px}.timeline .hint{display:none}.chart-selection{padding-inline:12px}.chart-foot{padding:10px 12px;flex-direction:column;gap:5px}.summary-grid{grid-template-columns:1fr;gap:0}.evidence-unit{border-bottom:1px solid var(--line)}.audit-grid{grid-template-columns:1fr}.tabbar{gap:18px;padding:0 12px}.tabbar button{font-size:12px}.tabbar .download{margin-left:0}.data-table td,.data-table th{padding:8px}.tabcontent{padding:12px}.presets button{font-size:11px;padding:4px 8px}}
@media print{body{background:var(--card)}.shell{padding:10px}.presets,.layers,.timeline,.chart-selection,.tabbar .download{display:none}.workspace,.event-panel{box-shadow:none}.analysis-workspace{grid-template-columns:minmax(0,1fr)}.summary-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.chartbox svg{height:480px}.hero{padding:12px 0}.fineprint{margin-top:10px}}
</style>
</head>
<body>
<main class="shell">
<header class="masthead"><div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 24V8m7 19V13m7 8V5m7 20V10M2 18l9-7 7 4 9-9"/></svg><div>KCPredict<small>结构分析与未来情景</small></div></div><div class="local">本地研究档案 · 单文件离线可用</div></header>
<div class="data-strip"><span class="status-dot">研究数据已载入</span><span>标的 <strong id="stripSymbol"></strong></span><span>实际行情截止 <strong id="stripDate"></strong></span><span>历史与预测共用连续时间轴</span></div>
<section class="hero"><div><div class="titleline"><h1 id="symbol"></h1><span class="subtitle">三个月综合研究</span></div><div class="meta" id="meta"></div><div class="quote"><strong id="close"></strong><span class="delta" id="windowChange"></span><span class="meta" id="relationship"></span></div></div><div class="quality" id="quality"><div class="badge" id="qualityBadge"></div><p id="qualityDescription"></p><div class="bar" id="qualityBar"><b id="qualityFill"></b><i id="qualityThreshold"></i></div><p id="qualityNumbers"></p></div></section>
<div class="analysis-workspace">
<section class="workspace" id="workspace">
<div class="chart-head"><div class="chart-title">结构分析与未来路径 <small id="rangeLabel"></small></div><div class="presets"><button data-window="all" class="active">完整窗口</button><button data-window="40">40根</button><button data-window="20">20根＋预测</button><button id="full">全屏</button></div></div>
<div class="layers"><label><input type="checkbox" data-layer="structure" checked><i class="dot"></i>笔与中枢</label><label><input type="checkbox" data-layer="ict" checked><i class="dot ict"></i>ICT</label><label><input type="checkbox" data-layer="prediction" checked><i class="dot median"></i>预测中位数</label><label><input type="checkbox" data-layer="band" checked><i class="dot band"></i>P10–P90</label><label><input type="checkbox" data-layer="samples"><i class="dot path"></i>有效样本路径</label><label><input type="checkbox" data-layer="volume" checked>成交量</label></div>
<div class="structure-legend" aria-label="图层说明"><span><i></i>确认笔</span><span><i class="pending"></i>形成中笔</span><span><i class="zone"></i>中枢 · 红涨绿跌</span><span><i class="fvg"></i>严格 FVG · 非买卖确认</span></div>
<div class="inspector" id="inspector" aria-live="polite"></div>
<div class="chartbox" id="chartbox"><svg id="chart" role="img" tabindex="0" aria-label="真实日线连接未来情景的连续时间轴；左右方向键平移，加减键缩放，Home恢复"></svg><div id="tooltip" class="tooltip" hidden></div></div>
<div class="chart-selection" id="selectionControls" hidden><span id="selectionCaption"></span><button id="resetSelection" type="button">取消固定</button></div>
<div class="timeline"><span id="visibleRange"></span><input type="range" id="pan" aria-label="平移时间窗口" min="0" value="0" step="1"><span class="hint">滚轮缩放 · 拖动平移 · 点击锁定日期</span></div>
<div class="chart-foot"><div class="legend"><span><i></i>收涨</span><span><i class="down"></i>收跌</span><span><i class="future"></i>未来情景区</span><span>蓝线：笔 · 红/绿框：中枢 · 蓝虚线：预测</span></div><span id="scenarioNote"></span></div>
</section>
<aside class="event-panel" aria-labelledby="eventsTitle"><div class="panel-heading"><h2 id="eventsTitle">事件与依据</h2><span>各方法独立验证</span></div><div class="summary-grid" id="evidenceGrid"></div><div class="takeaway" id="takeaway"></div></aside>
</div>
<section class="evidence"><div class="tabbar" role="tablist" aria-label="研究详情"><button class="active" role="tab" aria-selected="true" data-tab="evidencePanel">历史结构与确认时间</button><button role="tab" aria-selected="false" data-tab="forecastPanel">未来逐日明细</button><button role="tab" aria-selected="false" data-tab="auditPanel">数据与质量</button><button id="download" class="download">导出数据 ↓</button></div>
<div class="tabcontent" id="evidencePanel" role="tabpanel"><p class="note">锚点与确认时钟分开；形成中结构会变化。下表为本次截止日回溯结果。</p><div id="eventTable" class="scroll-table"></div></div>
<div class="tabcontent" id="forecastPanel" role="tabpanel" hidden><div id="forecastTable" class="scroll-table"></div><p class="note">P10–P90 是有效采样的收盘价分位区间；中位路径和区间均属于模型情景。上涨样本比例不等于校准概率或历史胜率。</p></div>
<div class="tabcontent" id="auditPanel" role="tabpanel" hidden><div class="audit-stats" id="auditStats"></div><div class="audit-grid" id="auditDetails"></div></div>
</section>
<footer class="fineprint" id="fineprint"></footer>
</main>
<script id="chart-data" type="application/json">__DATA_JSON__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('chart-data').textContent), B=D.bars, P=D.prediction, F=P.forecast||[], Q=P.quality||{}, N=B.length, H=F.length, T=N+H;
const $=id=>document.getElementById(id), e=value=>String(value??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), finite=x=>typeof x==='number'&&Number.isFinite(x), fmt=(x,k=2)=>finite(x)?x.toFixed(k):'—', pct=(x,k=2)=>finite(x)?(x*100).toFixed(k)+'%':'—', short=x=>String(x||'').slice(0,10), amount=x=>finite(x)?x>=1e8?fmt(x/1e8)+'亿股':x>=1e4?fmt(x/1e4)+'万股':fmt(x,0)+'股':'—';
const theme=D.theme, palette=theme.palette, colors={up:palette.up,down:palette.down,blue:palette.blue,gold:palette.gold,accent:palette.accent,purple:palette.purple,muted:palette.chart_muted}, last=B[N-1], dates=B.map(b=>short(b.time)).concat(F.map(f=>short(f.date))), dateIndex=new Map(dates.map((d,i)=>[d,i]));
const statusNames={pass:'预测质量通过',fail:'预测质量未通过',unavailable:'预测不可用',not_executed:'预测未执行'}, state={start:0,end:T-1,layers:{structure:true,ict:true,prediction:true,band:true,samples:false,volume:true},hover:null,pinned:false,drag:null};
const S=D.structure||{}, V=D.price_volume||{}, I=D.ict||{}, sc=S.current_state||{}, vc=V.current_state||{}, w=V.w32_latest||{}, notes=I.notes||[], fvg=I.latest_fvg||I.latest_bearish_fvg||I.latest_bullish_fvg;
const validDirection=x=>['available','partial'].includes(x.status)&&['BUY','SELL'].includes(x.direction_state)?x.direction_state:null, sdir=validDirection(S),vdir=validDirection(V);
const relationship=sdir&&vdir?sdir===vdir?'结构与量价同向，ICT仍需独立验证':'结构与量价方向存在分歧':'方向证据待核验';
const lastNote=[...notes].reverse().find(x=>['ssl_candidate','bsl_candidate'].includes(x.type));
function init(){
document.title=D.meta.symbol+' · 连续结构研究 · '+short(D.meta.data_end);$('symbol').textContent=D.meta.symbol;$('stripSymbol').textContent=D.meta.symbol;$('stripDate').textContent=short(D.meta.data_end);document.querySelector('.subtitle').textContent='近'+D.meta.months+'个月综合研究';$('meta').textContent=short(B[0].time)+' — '+short(last.time)+' · '+N+'根闭合日线 · '+(D.meta.price_basis==='unadjusted'?'未复权价格 / 元':'价格口径待核验')+' · '+(D.meta.timezone||'时区未报告');$('close').textContent=fmt(last.close);const delta=last.close/B[0].close-1;$('windowChange').textContent='窗口变化 '+(delta>0?'+':'')+pct(delta);$('windowChange').style.color=delta>=0?colors.up:colors.down;$('relationship').textContent=relationship;
$('quality').classList.add(P.status);$('qualityBadge').textContent=statusNames[P.status];$('qualityDescription').textContent=P.status==='pass'?'通过样本与输入可用性检查，仍需独立判断。':P.status==='fail'?'仅供观察采样情景，不能视为可用预测。':(P.reason||'保留已有历史证据与缺失原因。');
if(finite(Q.valid_fraction)){$('qualityFill').style.width=Math.min(1,Math.max(0,Q.valid_fraction))*100+'%';$('qualityThreshold').style.left=(Q.minimum_valid_fraction||0)*100+'%';$('qualityNumbers').textContent='有效 '+Q.valid_samples+'/'+Q.requested_samples+' · '+pct(Q.valid_fraction,3)+' / 门槛 '+pct(Q.minimum_valid_fraction,0)+' · 最少'+Q.minimum_valid_samples+'条';}else{$('qualityBar').hidden=true;$('qualityNumbers').textContent='未提供可评估的有效样本统计';}
$('scenarioNote').textContent=H?'最后真实收盘直接连接'+H+'日情景；蓝带为采样分位区间':'未产生未来路径；没有推算或补造交易日期';
$('fineprint').textContent='时钟：笔与中枢为当前截止日回溯几何，锚点与确认时间分开；形成中笔不作历史确认。ICT机械状态不等于最终交易确认。来源：'+(D.provenance.provenance||'未报告')+'，独立外部认证 '+(D.provenance.externally_verified===true?'是':'未完成')+'。图层与缩放仅改变显示，不会重算模型、改写历史或提高质量资格。形成中结构会变化 · 参考结果不代表实际成交。';
buildDetails(); inspect(N-1); draw();
}

$('chart').addEventListener('pointermove',event=>{if(state.drag){const g=$('chart')._geometry,offset=Math.round((state.drag.x-event.clientX)/g.step),count=state.drag.end-state.drag.start+1;if(Math.abs(event.clientX-state.drag.x)>5)state.drag.moved=true;state.start=Math.max(0,Math.min(T-count,state.drag.start+offset));state.end=state.start+count-1;draw();return;}if(state.pinned)return;state.hover=indexAt(event);inspect(state.hover);draw();let g=$('chart')._geometry,r=$('chart').getBoundingClientRect(),xx=event.clientX-r.left,yy=event.clientY-r.top,hit=[...g.interaction].reverse().find(a=>xx>=a.x0&&xx<=a.x1&&yy>=a.y0&&yy<=a.y1);$('tooltip').hidden=!hit;if(hit){$('tooltip').innerHTML=e(hit.text)+'<br><small>'+e(hit.detail)+'</small>';$('tooltip').style.left=Math.max(4,Math.min(xx+12,g.W-280))+'px';$('tooltip').style.top=Math.max(0,yy-68)+'px';}});
$('chart').addEventListener('pointerup',event=>{if(state.drag&&!state.drag.moved){state.hover=indexAt(event);state.pinned=!state.pinned;inspect(state.hover);}state.drag=null;draw();});
$('chart').addEventListener('pointercancel',()=>{state.drag=null;});$('chart').addEventListener('pointerleave',()=>{$('tooltip').hidden=true;if(!state.pinned&&!state.drag){state.hover=null;inspect(N-1);draw();}});
$('chart').addEventListener('keydown',event=>{if(['+','=','-','Home','ArrowLeft','ArrowRight'].includes(event.key))event.preventDefault();if(['+','='].includes(event.key))zoom(.8);else if(event.key==='-')zoom(1.25);else if(event.key==='Home')setWindow(T);else if(event.key==='ArrowLeft'||event.key==='ArrowRight'){let count=state.end-state.start+1;state.start=Math.max(0,Math.min(T-count,state.start+(event.key==='ArrowLeft'?-2:2)));state.end=state.start+count-1;draw();}});
$('resetSelection').addEventListener('click',resetSelection);document.addEventListener('keydown',event=>{if(event.key==='Escape')resetSelection();});
$('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('workspace').requestFullscreen();}catch{ $('full').textContent='浏览器未允许全屏';}});
$('download').addEventListener('click',()=>{let blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kcpredict-'+D.meta.symbol+'-'+short(D.meta.data_end)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
new ResizeObserver(()=>draw()).observe($('chartbox'));document.addEventListener('fullscreenchange',()=>{ $('full').textContent=document.fullscreenElement?'退出全屏':'全屏';draw();});
init();
</script>
